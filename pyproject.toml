[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchday-brief"
version = "1.0.0"
description = "Fixtures and results tracker with match reminders and AI previews and recaps where every number is checked against the data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Samiul Huda" }]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "jinja2>=3.1", "openai>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
matchday = "matchday.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
matchday = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/matchday"]
