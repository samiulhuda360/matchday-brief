<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Matchday Brief{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/"><span class="ball"></span>Matchday Brief</a>
    <span class="clock">{% block clock %}{% endblock %}</span>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer>Every number in a preview or recap is checked against the match data before it is saved.</footer>
</body>
</html>
